openapi: 3.1.0
info:
  title: Canopy cmdlp API
  version: 1.0.0
  summary: Links from YouTube, SoundCloud, Bandcamp, Mixcloud, archive.org, and most other sites yt-dlp knows, as audio a Canopy Music hub can play.
  description: |
    The API behind `cmdlp.canopysf.com`, for the Canopy Music hubs (iPad,
    Apple TV, and Mac). A hub sends a guest's link to `POST /resolve`,
    shows what comes back, and plays `audioUrl` once `GET /tracks/{id}`
    says `ready`. When the party ends, `DELETE /zones/{zone}`.

    **Conventions.** JSON in and out. Times are ISO 8601 UTC strings.
    Durations are seconds. Errors are
    `{"error": "<a sentence>", "reason": "<snake_case>"}` with the right
    status: branch on `reason`, show `error` if you like.

    **Zones.** A zone is whatever the hub calls a party: 1 to 64 letters,
    digits, `-`, or `_`. Each zone's audio is kept apart, and the same
    song pasted twice in one zone is one track, downloaded once. Audio is
    kept until its zone is deleted, or for 24 hours from when its link
    was resolved, whichever comes first.

    **Tokens.** Each hub has its own API token, made on the admin page
    (`/admin`) by the one admin, signed in with their Canopy Account. The
    `/admin/api` endpoints below are that page's own; hubs never use them.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://cmdlp.canopysf.com
    description: Production
  - url: http://localhost:3002
    description: Local development
tags:
  - name: Tracks
    description: Looking a link up, and its download.
  - name: Audio
    description: The audio itself.
  - name: Zones
    description: A party's cache.
  - name: Health
    description: Whether it's up, and which yt-dlp it's running.
  - name: Admin
    description: The admin page's API tokens. Signed in with a Canopy Account, as the admin.
security:
  - bearerAuth: []

paths:
  /resolve:
    post:
      tags: [Tracks]
      operationId: resolve
      summary: Look a link up and start downloading it
      description: |
        Answers with the track's title, artist, length, and artwork as soon
        as yt-dlp has looked it up (a few seconds; YouTube can take 20 or
        more), and downloads the audio in the background. Poll
        `GET /tracks/{id}` until `status` is `ready`.

        Resolving a link that's already a track in the zone answers with
        that track, `pending` or `ready`, without downloading it again. A
        `failed` one is tried again.

        A link the zone has seen before answers at once, with no lookup:
        any form of a YouTube video already in the zone (`youtu.be/<id>`,
        `watch?v=<id>`, `music.youtube.com`, `/shorts/`, `/live/`, or
        `/embed/`), or any link that led to one of its tracks before,
        compared without its tracking parameters (`si`, `is`, `utm_*`, and
        the like), fragment, and trailing slash. Each zone has its own; the
        same song in another zone is looked up again.

        A SoundCloud short link (`on.soundcloud.com/<code>`) is followed
        here first, since yt-dlp can't: https only, at most 5 redirects in
        5 seconds, only to SoundCloud, and only through public addresses.
        Both it and where it led are remembered, so it's instant pasted
        again.

        A link to a video in a playlist (`watch?v=...&list=...`) is the
        video. A link that's only a playlist, an album, a set, or a page
        of several videos, on any site, is a 422 `playlist`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, zone]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: An http(s) link to one track, on any site yt-dlp has an extractor for (but generic and a few that take other sites' links; see the README, "Which sites"), or a SoundCloud short link.
                  example: https://soundcloud.com/forss/flickermood
                zone:
                  $ref: '#/components/schemas/Zone'
                normalize:
                  type: boolean
                  default: true
                  description: "Whether its loudness is brought to the target (README, Loudness). false leaves the audio as it came, AAC first and copied, so it's ready sooner: a separate track from the normalized one."
      responses:
        '200':
          description: The track, `pending` (downloading) or already `ready`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400':
          description: |
            `bad_url` (not an http(s) link, or one with a user name in
            it), `bad_zone`, or `bad_json`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            `unsupported_link`: no extractor yt-dlp may use takes it (this is
            also what any other address, internal ones included, gets: the
            generic extractor is never on), or a short link that leads
            somewhere other than its site, over http, through more than 5
            redirects, to an address that isn't public, or nowhere.
            `playlist`: a playlist, album, set, or page of several videos,
            not one track.
            `live`: a live stream, or one that hasn't started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            yt-dlp couldn't look it up: `blocked` (YouTube asked to confirm
            this isn't a bot; see the README) or `lookup_failed` (anything
            else: a private or removed video, say). `error` is yt-dlp's own
            message. Also `lookup_failed` when a short link's shortener
            can't be reached or answers with an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: '`timeout`: the lookup took more than 90 seconds, or following a short link more than 5.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tracks/{id}:
    get:
      tags: [Tracks]
      operationId: getTrack
      summary: A track, and whether its audio is ready
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: The track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`not_found`: no such track, or its zone was deleted or swept.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /audio/{id}:
    get:
      tags: [Audio]
      operationId: getAudio
      summary: The audio, as an .m4a
      description: |
        AAC (sometimes ALAC) in an MP4 container, with its index at the
        front, so AVPlayer and Sonos can start before it has all arrived.
        Answers `Range` requests (206) and `HEAD`.

        Use the track's `audioUrl` as it is: it carries a `sig` that opens
        this one file, because Sonos can't send an `Authorization` header.
        A bearer token works too. The path may end in `.m4a` or not.
      security:
        - {}
      parameters:
        - name: id
          in: path
          required: true
          description: The track's id, optionally followed by `.m4a`.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}(\.m4a)?$' }
        - name: sig
          in: query
          required: false
          description: The key in the track's `audioUrl`. Needed unless there's a bearer token.
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: bytes=0-1023 }
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            audio/mp4:
              schema: { type: string, format: binary }
        '206':
          description: The part the `Range` asked for.
          headers:
            Content-Range: { schema: { type: string, example: bytes 0-1023/4315790 } }
          content:
            audio/mp4:
              schema: { type: string, format: binary }
        '401':
          description: '`unauthorized`: no `sig`, a wrong one, and no bearer token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`not_found`: no such track, or its zone was deleted or swept.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`not_ready`: still downloading.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: "`failed`: the download failed; the track's `error` says why."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /zones/{zone}:
    delete:
      tags: [Zones]
      operationId: deleteZone
      summary: Delete a zone's audio, when its party ends
      description: |
        Stops its downloads and deletes its tracks and files. Deleting a
        zone that has nothing is fine (`deleted: 0`). Its links can be
        resolved again afterwards, as new tracks.
      parameters:
        - name: zone
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Zone' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [zone, deleted]
                properties:
                  zone: { $ref: '#/components/schemas/Zone' }
                  deleted: { type: integer, description: How many tracks it had. }
        '400':
          description: '`bad_zone`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Up, and which yt-dlp
      description: No token needed. For Coolify's health check, and for seeing whether the daily update worked.
      security:
        - {}
      responses:
        '200':
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ytdlp]
                properties:
                  ok: { type: boolean, const: true }
                  ytdlp:
                    type: object
                    properties:
                      version: { type: [string, 'null'], description: The copy that runs (normally the latest nightly)., example: 2026.10.10.233141 }
                      previous: { type: [string, 'null'], description: The version before the last update, tried when the current one fails., example: 2026.08.19 }
                      stable: { type: [string, 'null'], description: The stable release in the image, tried last., example: 2026.08.19 }
                      updating: { type: boolean }
                      lastUpdate:
                        type: [object, 'null']
                        description: The last `yt-dlp --update-to nightly` since the server started.
                        properties:
                          at: { type: string, format: date-time }
                          ok: { type: boolean }
                          from: { type: [string, 'null'] }
                          to: { type: string }
                          error: { type: string }
                  deno: { type: [string, 'null'], description: The JavaScript runtime yt-dlp needs for YouTube., example: 2.9.7 }
                  tracks: { type: integer, description: Tracks in every zone. }
                  downloading: { type: integer }
                  queued: { type: integer }

  /admin/api/tokens:
    get:
      tags: [Admin]
      operationId: listTokens
      summary: The API tokens
      security:
        - canopySession: []
      responses:
        '200':
          description: Every token, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '503': { $ref: '#/components/responses/AdminDenied' }
    post:
      tags: [Admin]
      operationId: createToken
      summary: Make a token
      security:
        - canopySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 60, example: Living Room iPad }
      responses:
        '201':
          description: Made. `token` is shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewApiToken' }
        '400':
          description: '`bad_label`: empty, or longer than 60 characters.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '503': { $ref: '#/components/responses/AdminDenied' }

  /admin/api/tokens/{id}/regenerate:
    post:
      tags: [Admin]
      operationId: regenerateToken
      summary: Replace a token
      description: A new token under the same label. The old one stops working at once.
      security:
        - canopySession: []
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: The new token, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewApiToken' }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404':
          description: '`not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/AdminDenied' }

  /admin/api/tokens/{id}:
    delete:
      tags: [Admin]
      operationId: revokeToken
      summary: Revoke a token
      description: It stops working at once.
      security:
        - canopySession: []
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404':
          description: '`not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/AdminDenied' }

  /admin/api/test:
    post:
      tags: [Admin]
      operationId: testLink
      summary: Test a link, as the admin
      description: |
        `POST /resolve`, for the admin page's "Test a link", with no API
        token: the track goes in the `admin-test` zone. Poll
        `GET /admin/api/test/{id}`.
      security:
        - canopySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, example: https://soundcloud.com/forss/flickermood }
      responses:
        '200':
          description: The track.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '400':
          description: '`bad_url`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '422':
          description: '`unsupported_link`, `playlist`, or `live`, as for `POST /resolve`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`blocked` or `lookup_failed`, as for `POST /resolve`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/AdminDenied' }
        '504':
          description: '`timeout`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Admin]
      operationId: clearTests
      summary: Clear test files
      description: Deletes the `admin-test` zone. The 24-hour sweep would anyway.
      security:
        - canopySession: []
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, description: How many tracks it had. }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '503': { $ref: '#/components/responses/AdminDenied' }

  /admin/api/test/{id}:
    get:
      tags: [Admin]
      operationId: getTest
      summary: A tested link's track
      security:
        - canopySession: []
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: The track, with `progress` while it downloads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '401': { $ref: '#/components/responses/AdminDenied' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404':
          description: '`not_found`: cleared, swept, or not a test.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/AdminDenied' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer cmdlp_<43 characters>`: the hub's own API
        token, from the admin page. Everything but `/health`, a signed
        `audioUrl`, and `/admin/api` needs one. Regenerating or revoking a
        token on the admin page stops it working at once.
    canopySession:
      type: apiKey
      in: cookie
      name: canopy_session
      description: |
        For `/admin/api` only: the admin page's own requests, signed in
        with a Canopy Account (the cookie is set by `account.canopysf.com`
        for all of `canopysf.com`). The account must have a confirmed
        email equal to `ADMIN_EMAIL`, compared ignoring case. Changes
        (POST, DELETE) must carry an `Origin` header for a Canopy page, or
        get 403 `bad_origin`.

  parameters:
    TrackId:
      name: id
      in: path
      required: true
      description: The track's id, 22 characters of base64url.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
      example: M9xQFZLlR5L-VkfG3YQQLp

    TokenId:
      name: id
      in: path
      required: true
      description: The token's id (not the token itself).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{12}$' }

  responses:
    AdminDenied:
      description: |
        Not the admin. 401 `signed_out` (with `signIn`, a URL to sign in
        and come back); 403 `not_admin`, `email_unverified`,
        `email_not_granted` (the "cmdlp" site isn't granted the email
        field), `admin_email_not_set`, or `bad_origin`; 503 `not_set_up`
        or `accounts_unreachable`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`unauthorized`: no bearer token, or the wrong one.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Zone:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: The party this is for, in the hub's own words.
      example: living-room-2026-10-31

    Track:
      type: object
      required: [id, zone, normalize, status, title, artist, duration, artwork, source, service, webpageUrl, url, audioUrl, createdAt]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
        zone: { $ref: '#/components/schemas/Zone' }
        normalize: { type: boolean, description: "Whether its loudness is brought to the target (what `/resolve` was asked)." }
        status:
          type: string
          enum: [pending, ready, failed]
          description: '`pending` while it downloads; `ready` once `audioUrl` plays; `failed` if it never will (see `error`).'
        title: { type: [string, 'null'], description: "The song's name where the site has one (YouTube Music does), or else the upload's title.", example: Flickermood }
        artist: { type: [string, 'null'], description: The artist where the site says, or else whoever uploaded it., example: Forss }
        duration: { type: [number, 'null'], description: Seconds., example: 213.886 }
        artwork: { type: [string, 'null'], format: uri, description: "The largest JPEG the site has that was checked and exists (for YouTube, at least hqdefault.jpg). A SoundCloud track with none gets the SoundCloud logo, served by this service at /artwork/soundcloud.jpg with no token. It can still fail to load later: hide the image if it does." }
        source: { type: [string, 'null'], description: "yt-dlp's name for the site (its extractor's key).", examples: [Youtube, Soundcloud, Bandcamp, Mixcloud, ArchiveOrg, Vimeo] }
        service: { type: [string, 'null'], description: "The site's name as people write it, for YouTube, SoundCloud, Bandcamp, Mixcloud, and archive.org; for any other site, the same as `source`.", examples: [YouTube, SoundCloud, Bandcamp, Mixcloud, archive.org, Vimeo] }
        stage:
          type: string
          enum: [queued, downloading, converting]
          description: |
            Only while `pending`. `queued`: waiting for a download slot (two
            run at once). `downloading`: see `progress`. `converting`:
            downloaded, being made into the .m4a (seconds; longer when it's
            re-encoded).
        progress:
          description: |
            Only while `pending`, and null until yt-dlp has said something.
            Up to the moment: poll `GET /tracks/{id}` about once a second.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Progress'
        webpageUrl: { type: [string, 'null'], format: uri, description: The track's own page. }
        url: { type: string, description: The link as it was sent. }
        audioUrl:
          type: string
          format: uri
          description: Where the audio is, with its own key (`sig`). Plays once `status` is `ready`; a 409 until then.
          example: https://cmdlp.canopysf.com/audio/M9xQFZLlR5L-VkfG3YQQLp.m4a?sig=k82Gxp4VBgSbf1T-8yfJ14sSVFVw2qG1
        createdAt: { type: string, format: date-time, description: When the link was resolved; the 24 hours count from here. }
        readyAt: { type: string, format: date-time, description: Only when `ready`. }
        size: { type: integer, description: Bytes. Only when `ready`. }
        codec: { type: string, description: 'What the site sent (`aac`, `opus`, `mp3`...). Only when `ready`.' }
        transcoded: { type: boolean, description: "Whether it was re-encoded to AAC (false: copied as it was). Only when `ready`." }
        loudness:
          type: [object, 'null']
          description: "Its loudness, from ffmpeg's measure of the download. null when the target is off, it couldn't be measured, or it was ready before this was added. Only when `ready`."
          properties:
            measured: { type: number, description: The download's integrated loudness in LUFS. }
            target: { type: number, description: The loudness tracks are brought to (`LOUDNESS_TARGET`). }
            adjusted: { type: boolean, description: "Whether it was changed to the target (false: already within 1 LU of it)." }
        error: { type: string, description: Why the download failed. Only when `failed`. }

    Progress:
      type: object
      description: |
        `percent` and `eta` are for the whole of it, downloading and
        converting together (the download is the first 40%): one figure,
        never going down. The byte counts are the download's.
      required: [percent, downloadedBytes, totalBytes, totalBytesEstimate, speed, eta]
      properties:
        percent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: |
            How far along the whole is: the download (from the exact size
            when the site gives one, or else from how many of the stream's
            pieces are in) is 0–40, converting 40–100. null while the
            download's share isn't known: show progress without a
            percentage, not one made from `totalBytesEstimate`.
          example: 42.5
        downloadedBytes: { type: [integer, 'null'], example: 1835008 }
        totalBytes: { type: [integer, 'null'], description: The exact size, when the site says. }
        totalBytesEstimate: { type: [number, 'null'], description: "yt-dlp's guess at the size, for streams in pieces. Can be well off." }
        speed: { type: [number, 'null'], description: Bytes per second. }
        eta: { type: [number, 'null'], description: "Seconds left for the whole (downloading and converting), from the rate so far. null at first." }

    ApiToken:
      type: object
      description: A token as the admin page lists it. Never the token itself, which isn't kept.
      required: [id, label, hint, createdAt, regeneratedAt, lastUsedAt]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{12}$' }
        label: { type: string, maxLength: 60, example: Living Room iPad }
        hint: { type: string, description: "The token's last four characters, to tell them apart.", example: x9Qa }
        createdAt: { type: string, format: date-time }
        regeneratedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time, description: Up to a minute behind. }

    NewApiToken:
      type: object
      required: [token, record]
      properties:
        token:
          type: string
          pattern: '^cmdlp_[A-Za-z0-9_-]{43}$'
          description: The token itself. This is the only time it's ever shown.
        record: { $ref: '#/components/schemas/ApiToken' }

    Error:
      type: object
      required: [error, reason]
      properties:
        error: { type: string, description: A sentence for people. }
        reason: { type: string, description: snake_case, for code. }
